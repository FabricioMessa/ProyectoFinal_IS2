<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:User="http://www.w3.org/1999/xhtml"
      layout:decorate="~{fragments/layout.html}">
<head>
    <title>Product System - Dashboard</title>
</head>
<body>

<div layout:fragment="content" th:remove="tag">
    <nav class="navbar navbar-default" role="navigation">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle" data-toggle="collapse"
                    data-target="#bs-example-navbar-collapse-1">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="/products">📦 Sistema de Productos</a>
        </div>

        <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
            <ul class="nav navbar-nav">
                <li><a class="glyphicon glyphicon-user"></a></li>
                <li><a href="#" sec:authentication="name" style="font-weight: bold; color: #337ab7;"></a></li>
                <li><a href="/api/swagger-ui.html" target="_blank" style="color: #5cb85c;"><i class="glyphicon glyphicon-book"></i> API Docs</a></li>
            </ul>
            <div class="navbar-form">
                <div class="col-sm-3 col-md-3">
                    <div class="input-group">
                        <input type="search" class="form-control" placeholder="Buscar producto en tiempo real..." id="inputFilter">
                        <div class="input-group-btn">
                            <button type="button" class="btn btn-default" id="searchButton"><i
                                    class="glyphicon glyphicon-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <ul class="nav navbar-nav navbar-right">
                <li><a th:href="@{/logout}" class="text-danger"><i class="glyphicon glyphicon-log-out"></i> Log out</a></li>
            </ul>
        </div></nav>

    <div class="panel panel-default" style="box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
        <div class="panel-heading" style="background-color: #f5f5f5;">
            <h3 style="margin-top: 10px; margin-bottom: 20px; color: #333;">📋 Listado de Productos</h3>
            
            <table class="table table-striped table-hover" id="productTable">
                <thead>
                <tr class="info">
                    <th>Nombre del Producto</th>
                    <th>ID Categoría</th>
                    <th>Stock / Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${productPage.content}" id="products">
                    <td class="productname" th:text="${product.name}" style="font-weight: 500;"></td>
                    <td>
                        <span class="label label-info" th:text="'Cat: ' + ${product.category.id}" style="font-size: 90%;"></span>
                    </td>
                    <td th:text="${product.quantity}"></td>
                    <td th:text="'$' + ${product.price}" style="font-weight: bold; color: #2e7d32;"></td>
                    <td>
                        <a th:href="@{products/edit/{id}(id=${product.id})}" class="btn btn-primary btn-sm"><i class="glyphicon glyphicon-pencil"></i> Editar</a>
                        <a th:href="@{products/delete/{id}(id=${product.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar este producto?');"><i class="glyphicon glyphicon-trash"></i> Eliminar</a>
                    </td>
                </tr>
                <tr id="noResultsRow" style="display: none;">
                    <td colspan="5" class="text-center text-muted" style="padding: 20px;">
                        <i class="glyphicon glyphicon-info-sign"></i> No se encontraron productos que coincidan con la búsqueda.
                    </td>
                </tr>
                </tbody>
            </table>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                <a href="/products/add" class="btn btn-success"><i class="glyphicon glyphicon-plus"></i> Añadir Producto</a>
                
                <nav aria-label="Page navigation" style="margin: 0;">
                    <ul class="pagination" style="margin: 0;">
                        <li th:class="${productPage.number eq 0} ? 'hidden' : 'page-item'">
                            <a th:href="@{/products(size=${productPage.size}, page=${productPage.number})}"
                               class="page-link" aria-label="Previous" id="previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:each="pageNumber : ${pageNumbers}" th:class="${pageNumber==productPage.number + 1} ? 'active'">
                            <a th:href="@{/products(size=${productPage.size}, page=${pageNumber})}"
                               th:text=${pageNumber}></a>
                        </li>
                        <li th:class="${productPage.number + 1 == productPage.totalPages} ? 'hidden' : 'page-item'">
                            <a class="page-link"
                               th:href="@{/products(size=${productPage.size}, page=${productPage.number + 2})}"
                               aria-label="Next" id="next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function() {
            const inputFilter = document.getElementById("inputFilter");
            const tableRows = document.querySelectorAll("#productTable tbody tr:not(#noResultsRow)");
            const noResultsRow = document.getElementById("noResultsRow");

            inputFilter.addEventListener("keyup", function() {
                const searchTerm = inputFilter.value.toLowerCase().trim();
                let hasResults = false;

                tableRows.forEach(row => {
                    const productName = row.querySelector(".productname").textContent.toLowerCase();
                    if (productName.includes(searchTerm)) {
                        row.style.display = "";
                        hasResults = true;
                    } else {
                        row.style.display = "none";
                    }
                });

                if (hasResults) {
                    noResultsRow.style.display = "none";
                } else {
                    noResultsRow.style.display = "";
                }
            });
        });
    </script>
</div>
</body>
</html>
